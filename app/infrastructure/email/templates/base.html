<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px;
            background: #f4f5f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #1b1b1b;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        .header {
            background: #032D42;
            border-bottom: 4px solid #81B53F;
            padding: 24px 32px;
        }

        .brand {
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .brand span {
            color: #81B53F;
        }

        .card {
            background: #ffffff;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            margin-top: 28px;
            padding: 40px;
        }

        .content {
            line-height: 1.7;
            font-size: 15px;
        }

        .button {
            display: inline-block;
            margin-top: 28px;
            padding: 14px 26px;
            background: #81B53F;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #6f9d36;
        }

        .link {
            word-break: break-word;
            color: #032D42;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            color: #666666;
            font-size: 13px;
        }

        hr {
            margin: 32px 0;
            border: none;
            border-top: 1px solid #dddddd;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1 class="brand">
            Service<span>Now</span> AI Platform
        </h1>

    </div>

    <div class="card">

        <div class="content">

            {{ content }}

        </div>

    </div>

    <div class="footer">

        <p>
            © {{ year }} ServiceNow AI Platform
        </p>

        <p>
            This is an automated email. Please do not reply.
        </p>

    </div>

</div>

</body>

</html>
