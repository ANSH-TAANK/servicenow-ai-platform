<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="x-apple-disable-message-reformatting"
    >

    <title>{{ title }}</title>

    <style>
        /* ------------------------------
           Base / Email Reset
        ------------------------------ */

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }

        body {
            background-color: #f4f5f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #1b1b1b;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        * {
            box-sizing: border-box;
        }

        table {
            border-spacing: 0;
            border-collapse: collapse;
        }

        img {
            border: 0;
            display: block;
            max-width: 100%;
        }

        p,
        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        /* Prevent long content from breaking the email */
        .text-content {
            max-width: 100%;
            overflow-wrap: anywhere;
            word-break: break-word;
            white-space: normal;
        }

        /* ------------------------------
           Main Email Wrapper
        ------------------------------ */

        .email-wrapper {
            width: 100%;
            background-color: #f4f5f7;
            padding: 32px 16px;
        }

        .email-container {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background-color: #ffffff;
        }

        /* ------------------------------
           Header
        ------------------------------ */

        .header {
            background-color: #032D42;
            border-bottom: 4px solid #81B53F;
            padding: 24px 32px;
        }

        .brand {
            margin: 0;
            color: #ffffff;
            font-size: 28px;
            line-height: 1.25;
            font-weight: 700;
        }

        .brand span {
            color: #81B53F;
        }

        /* ------------------------------
           Content Card
        ------------------------------ */

        .card {
            background-color: #ffffff;
            border: 1px solid #d9d9d9;
            border-top: 0;
        }

        .content {
            padding: 40px;
            font-size: 15px;
            line-height: 1.7;
        }

        /* ------------------------------
           Common Elements
        ------------------------------ */

        .button {
            display: inline-block;
            margin-top: 28px;
            padding: 14px 26px;
            background-color: #81B53F;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .link {
            color: #032D42;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        hr {
            margin: 32px 0;
            border: 0;
            border-top: 1px solid #dddddd;
        }

        /* ------------------------------
           Footer
        ------------------------------ */

        .footer {
            width: 100%;
            padding: 24px 16px;
            text-align: center;
            background-color: #f4f5f7;
            color: #666666;
            font-size: 13px;
            line-height: 1.5;
        }

        .footer p {
            margin: 0 0 6px 0;
        }

        .footer p:last-child {
            margin-bottom: 0;
        }

        /* ------------------------------
           Mobile
        ------------------------------ */

        @media only screen and (max-width: 600px) {

            .email-wrapper {
                padding: 0 !important;
            }

            .email-container {
                width: 100% !important;
                max-width: 100% !important;
            }

            .header {
                padding: 20px 18px !important;
            }

            .brand {
                font-size: 23px !important;
                line-height: 1.3 !important;
            }

            .content {
                padding: 28px 18px !important;
                font-size: 15px !important;
                line-height: 1.65 !important;
            }

            .footer {
                padding: 20px 16px !important;
            }

            .text-content {
                width: 100% !important;
                max-width: 100% !important;
                overflow-wrap: anywhere !important;
                word-break: break-word !important;
            }
        }
    </style>
</head>

<body>

    <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        border="0"
        class="email-wrapper"
    >
        <tr>
            <td align="center">

                <table
                    role="presentation"
                    width="100%"
                    cellpadding="0"
                    cellspacing="0"
                    border="0"
                    class="email-container"
                >

                    <!-- Header -->
                    <tr>
                        <td class="header">

                            <h1 class="brand">
                                Service<span>Now</span> AI Platform
                            </h1>

                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td class="card">

                            <div class="content">
                                {{ content }}
                            </div>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="footer">

                            <p>
                                © {{ year }} ServiceNow AI Platform
                            </p>

                            <p>
                                This is an automated email. Please do not reply.
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
